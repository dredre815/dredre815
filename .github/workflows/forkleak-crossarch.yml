name: ForkLeak Cross-Architecture Evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "forkleak/**"
      - ".github/workflows/forkleak-crossarch.yml"

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  forkleak:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PRIOR_ARTIFACT_ID: "8815259198"
      RESULTS_DIR: "${{ github.workspace }}/forkleak_results"
      PRIOR_DIR: "${{ github.workspace }}/forkleak_prior"
      RUNTIME_DIR: "${{ github.workspace }}/forkleak_runtime"
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout ForkLeak harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish ephemeral RSA handoff key
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/forkleak-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/forkleak-private.pem -pubout \
            -out /tmp/forkleak-public.pem >/dev/null 2>&1
          PUBLIC_KEY_B64="$(base64 -w0 /tmp/forkleak-public.pem)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="ForkLeak encrypted one-time-key handoff for workflow run ${GITHUB_RUN_ID}. The matching private key exists only in this runner.\n\nFORKLEAK_KEY_RUN=${GITHUB_RUN_ID}\nFORKLEAK_PUBLIC_KEY_B64=${PUBLIC_KEY_B64}"
          echo "ForkLeak public key published; private key remains runner-local."

      - name: Set up base Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numerical and reporting dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install \
            "numpy==1.26.4" "pandas==2.2.3" "scipy==1.13.1" \
            "pyarrow==19.0.1" "matplotlib==3.9.4" \
            "openai>=2.52,<3"
          python forkleak/bootstrap_forkleak.py --out "$RUNTIME_DIR"
          if compgen -G "forkleak/overrides/*.py" >/dev/null; then
            cp forkleak/overrides/*.py "$RUNTIME_DIR"/
          fi
          python -m py_compile "$RUNTIME_DIR"/*.py

      - name: Download frozen Qlib evidence
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          mkdir -p "$PRIOR_DIR" "$RESULTS_DIR"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRIOR_ARTIFACT_ID}/zip" \
            -o /tmp/forkleak-prior.zip
          unzip -t /tmp/forkleak-prior.zip >/dev/null
          unzip -q /tmp/forkleak-prior.zip -d "$PRIOR_DIR"
          test -f "$PRIOR_DIR/qlib_labels.parquet"
          sha256sum /tmp/forkleak-prior.zip > "$RESULTS_DIR/prior_artifact_zip.sha256"
          python "$RUNTIME_DIR/prepare_market.py" \
            --labels "$PRIOR_DIR/qlib_labels.parquet" \
            --out "$RESULTS_DIR"

      - name: Install framework runtimes in isolated environments
        shell: bash
        run: |
          set -euo pipefail
          python -m venv --system-site-packages /tmp/venv-langgraph
          /tmp/venv-langgraph/bin/python -m pip install --upgrade pip
          /tmp/venv-langgraph/bin/python -m pip install \
            "langgraph>=1.0,<2" "langgraph-checkpoint-sqlite>=2,<4"

          python -m venv --system-site-packages /tmp/venv-autogen
          /tmp/venv-autogen/bin/python -m pip install --upgrade pip
          /tmp/venv-autogen/bin/python -m pip install "autogen-agentchat>=0.7,<0.8"

          python -m venv --system-site-packages /tmp/venv-crewai
          /tmp/venv-crewai/bin/python -m pip install --upgrade pip
          /tmp/venv-crewai/bin/python -m pip install "crewai==1.14.7"

          git clone --filter=blob:none https://github.com/TauricResearch/TradingAgents.git /tmp/TradingAgents
          git -C /tmp/TradingAgents checkout a33fd4c0f134485a43553a2c23a63cb14adbd88f

      - name: Run native state-fork experiments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR/frameworks" "$RESULTS_DIR/crewai_storage"
          export CREWAI_STORAGE_DIR="$RESULTS_DIR/crewai_storage"

          /tmp/venv-langgraph/bin/python "$RUNTIME_DIR/langgraph_adapter.py" \
            --sample "$RESULTS_DIR/sample_case.json" \
            --out "$RESULTS_DIR/frameworks/langgraph.json"

          /tmp/venv-autogen/bin/python "$RUNTIME_DIR/autogen_adapter.py" \
            --sample "$RESULTS_DIR/sample_case.json" \
            --out "$RESULTS_DIR/frameworks/autogen.json"

          /tmp/venv-crewai/bin/python "$RUNTIME_DIR/crewai_adapter.py" \
            --sample "$RESULTS_DIR/sample_case.json" \
            --out "$RESULTS_DIR/frameworks/crewai.json"

          PYTHONPATH="/tmp/TradingAgents:${PYTHONPATH:-}" \
          /tmp/venv-langgraph/bin/python "$RUNTIME_DIR/tradingagents_adapter.py" \
            --sample "$RESULTS_DIR/sample_case.json" \
            --repo /tmp/TradingAgents \
            --out "$RESULTS_DIR/frameworks/tradingagents.json"

      - name: Run real-market ForkLeak and defense sweep
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNTIME_DIR/run_market.py" \
            --labels "$PRIOR_DIR/qlib_labels.parquet" \
            --framework-dir "$RESULTS_DIR/frameworks" \
            --out "$RESULTS_DIR" \
            --days 300 \
            2>&1 | tee "$RESULTS_DIR/market_sweep.log"

      - name: Await encrypted one-time OpenAI key and run lineage audit
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF}"
          FOUND=0
          for attempt in $(seq 1 180); do
            URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/experiments/forkleak_secret_payload.b64?nonce=$(date +%s%N)"
            if curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$URL" \
              -o /tmp/forkleak-cipher.b64; then
              if [[ -s /tmp/forkleak-cipher.b64 ]] && \
                 grep -Eq '^[A-Za-z0-9+/=[:space:]]+$' /tmp/forkleak-cipher.b64; then
                FOUND=1
                break
              fi
            fi
            sleep 10
          done
          if [[ "$FOUND" != "1" ]]; then
            echo "Encrypted ForkLeak key handoff was not received." >&2
            exit 1
          fi
          tr -d '\r\n ' < /tmp/forkleak-cipher.b64 | base64 -d > /tmp/forkleak-cipher.bin
          OPENAI_API_KEY="$(openssl pkeyutl -decrypt \
            -inkey /tmp/forkleak-private.pem \
            -in /tmp/forkleak-cipher.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256)"
          test -n "$OPENAI_API_KEY"
          echo "::add-mask::$OPENAI_API_KEY"
          export OPENAI_API_KEY
          mkdir -p "$RESULTS_DIR/llm"
          python "$RUNTIME_DIR/llm_lineage_audit.py" \
            --framework-details "$RESULTS_DIR/framework_native_details.json" \
            --case-study "$RESULTS_DIR/case_study.json" \
            --out "$RESULTS_DIR/llm" \
            --trials 8 --workers 8 --max-attempts 5 \
            2>&1 | tee "$RESULTS_DIR/llm_lineage_audit.log"
          unset OPENAI_API_KEY
          shred -u /tmp/forkleak-cipher.bin /tmp/forkleak-cipher.b64 || true

      - name: Build ForkLeak reports and provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR/final"
          if [[ -f "$RESULTS_DIR/paper_assessment.json" && \
                -f "$RESULTS_DIR/llm/llm_audit_result.json" ]]; then
            python "$RUNTIME_DIR/build_report.py" \
              --results "$RESULTS_DIR" \
              --out "$RESULTS_DIR/final" \
              2>&1 | tee "$RESULTS_DIR/build_report.log"
          fi
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          out = Path(os.environ["RESULTS_DIR"]) / "workflow_provenance.json"
          def cmd(s):
              try: return subprocess.check_output(s, shell=True, text=True, stderr=subprocess.STDOUT).strip()
              except Exception as exc: return f"unavailable:{type(exc).__name__}"
          out.write_text(json.dumps({
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_sha": os.environ.get("GITHUB_SHA"),
              "head_ref": os.environ.get("GITHUB_HEAD_REF"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "platform": platform.platform(),
              "python": platform.python_version(),
              "pip_freeze_sha256": cmd("python -m pip freeze | sha256sum"),
              "langgraph_freeze_sha256": cmd("/tmp/venv-langgraph/bin/python -m pip freeze | sha256sum"),
              "autogen_freeze_sha256": cmd("/tmp/venv-autogen/bin/python -m pip freeze | sha256sum"),
              "crewai_freeze_sha256": cmd("/tmp/venv-crewai/bin/python -m pip freeze | sha256sum"),
              "tradingagents_head": cmd("git -C /tmp/TradingAgents rev-parse HEAD"),
              "prior_artifact_id": os.environ.get("PRIOR_ARTIFACT_ID"),
          }, indent=2), encoding="utf-8")
          PY
          find "$RESULTS_DIR" -maxdepth 4 -type f -printf '%P\n' | sort

      - name: Destroy runner-local key material
        if: always()
        shell: bash
        run: |
          shred -u \
            /tmp/forkleak-private.pem \
            /tmp/forkleak-public.pem \
            /tmp/forkleak-cipher.bin \
            /tmp/forkleak-cipher.b64 2>/dev/null || true

      - name: Upload ForkLeak evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forkleak-crossarch-${{ github.run_id }}
          path: forkleak_results/
          if-no-files-found: error
          retention-days: 14
