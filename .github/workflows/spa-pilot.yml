name: SPA E1 mechanism pilot

on:
  pull_request:
    branches: [main]
    paths:
      - 'spa-pilot/**'
      - '.github/workflows/spa-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spa-e1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TA_COMMIT: a33fd4c0f134485a43553a2c23a63cb14adbd88f
      MODEL_SNAPSHOT: gpt-5.4-mini-2026-03-17
      MPLBACKEND: Agg

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'spa-pilot-gpt54mini-20260803' }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: spa-pilot/requirements.txt

      - name: Install experiment dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r spa-pilot/requirements.txt

      - name: Assemble and syntax-check experiment source
        run: |
          set -euo pipefail
          cat spa-pilot/src_parts/part-*.pyfrag > spa-pilot/run_spa_pilot.py
          python -m py_compile spa-pilot/run_spa_pilot.py
          test "$(wc -l < spa-pilot/run_spa_pilot.py)" -eq 1036
          echo 'c779f8ec7562a731ea47e24837a0b4555dec80ce0c8896558b1428af70a69c8d  spa-pilot/run_spa_pilot.py' | sha256sum --check

      - name: Fetch pinned TradingAgents source
        run: |
          set -euo pipefail
          rm -rf spa-pilot/vendor/TradingAgents
          mkdir -p spa-pilot/vendor/TradingAgents
          git -C spa-pilot/vendor/TradingAgents init -q
          git -C spa-pilot/vendor/TradingAgents remote add origin https://github.com/TauricResearch/TradingAgents.git
          git -C spa-pilot/vendor/TradingAgents fetch -q --depth=1 origin "$TA_COMMIT"
          git -C spa-pilot/vendor/TradingAgents checkout -q --detach FETCH_HEAD
          test "$(git -C spa-pilot/vendor/TradingAgents rev-parse HEAD)" = "$TA_COMMIT"
          # Isolate the exact memory/rating modules without importing every analyst dependency.
          : > spa-pilot/vendor/TradingAgents/tradingagents/agents/__init__.py
          : > spa-pilot/vendor/TradingAgents/tradingagents/agents/utils/__init__.py

      - name: Generate ephemeral RSA public key
        id: handoff
        env:
          BRANCH: ${{ github.head_ref || 'spa-pilot-gpt54mini-20260803' }}
        run: |
          set -euo pipefail
          mkdir -p spa-pilot/handshake
          if [ -f spa-pilot/handshake/public.pem ]; then
            echo 'A prior runner owns the matching ephemeral private key; this follow-up run exits without consuming a credential.'
            echo 'owns_key=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/spa-private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/spa-private.pem" -pubout -out spa-pilot/handshake/public.pem >/dev/null 2>&1

          git config user.name 'spa-e1-runner'
          git config user.email 'spa-e1-runner@users.noreply.github.com'
          git add spa-pilot/handshake/public.pem
          git commit -m 'SPA E1: publish ephemeral encryption key'
          git push origin "HEAD:${BRANCH}"
          echo 'owns_key=true' >> "$GITHUB_OUTPUT"

      - name: Wait for encrypted key and run preregistered pilot
        if: steps.handoff.outputs.owns_key == 'true'
        env:
          BRANCH: ${{ github.head_ref || 'spa-pilot-gpt54mini-20260803' }}
        run: |
          set -euo pipefail
          umask 077
          found=0
          for _ in $(seq 1 240); do
            git fetch -q origin "$BRANCH"
            if git show "origin/${BRANCH}:spa-pilot/handshake/openai_key.enc.b64" > "$RUNNER_TEMP/openai_key.enc.b64" 2>/dev/null; then
              found=1
              break
            fi
            sleep 10
          done
          if [ "$found" != 1 ]; then
            echo 'Encrypted API key was not supplied before timeout.' >&2
            exit 2
          fi

          base64 --decode "$RUNNER_TEMP/openai_key.enc.b64" > "$RUNNER_TEMP/openai_key.enc"
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/spa-private.pem" \
            -in "$RUNNER_TEMP/openai_key.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            > "$RUNNER_TEMP/spa-openai.key"

          OPENAI_API_KEY="$(cat "$RUNNER_TEMP/spa-openai.key")"
          case "$OPENAI_API_KEY" in
            sk-*) ;;
            *) echo 'Decrypted payload does not look like an OpenAI API key.' >&2; exit 1 ;;
          esac
          echo "::add-mask::$OPENAI_API_KEY"

          rm -rf spa-pilot/results
          mkdir -p spa-pilot/results
          OPENAI_API_KEY="$OPENAI_API_KEY" python spa-pilot/run_spa_pilot.py \
            --vendor spa-pilot/vendor/TradingAgents \
            --out spa-pilot/results \
            --model "$MODEL_SNAPSHOT" \
            --reasoning-effort low \
            --replicates 5 \
            --concurrency 6 \
            2>&1 | tee spa-pilot/results/execution.log

          unset OPENAI_API_KEY
          shred -u "$RUNNER_TEMP/spa-openai.key" "$RUNNER_TEMP/spa-private.pem" "$RUNNER_TEMP/openai_key.enc" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/openai_key.enc.b64"

      - name: Validate result bundle
        if: steps.handoff.outputs.owns_key == 'true'
        run: |
          set -euo pipefail
          test -s spa-pilot/results/report.md
          test -s spa-pilot/results/manifest.json
          test -s spa-pilot/results/reflections.jsonl
          test -s spa-pilot/results/portfolio_decisions.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('spa-pilot/results/manifest.json').read_text())
          assert manifest['model_used'] == 'gpt-5.4-mini-2026-03-17'
          assert manifest['tradingagents_commit'] == 'a33fd4c0f134485a43553a2c23a63cb14adbd88f'
          assert manifest['admission_conditioned'] is True
          print(json.dumps({
              'model': manifest['model_used'],
              'usage': manifest['usage'],
              'estimated_cost_usd': manifest['estimated_cost_usd'],
              'api_error_records': manifest['api_error_records'],
          }, indent=2))
          PY

      - name: Commit source and results to experiment branch
        if: steps.handoff.outputs.owns_key == 'true'
        env:
          BRANCH: ${{ github.head_ref || 'spa-pilot-gpt54mini-20260803' }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/spa-results" "$RUNNER_TEMP/run_spa_pilot.py"
          cp -a spa-pilot/results "$RUNNER_TEMP/spa-results"
          cp spa-pilot/run_spa_pilot.py "$RUNNER_TEMP/run_spa_pilot.py"

          git fetch -q origin "$BRANCH"
          git reset --hard "origin/${BRANCH}"
          rm -rf spa-pilot/results spa-pilot/vendor
          cp -a "$RUNNER_TEMP/spa-results" spa-pilot/results
          cp "$RUNNER_TEMP/run_spa_pilot.py" spa-pilot/run_spa_pilot.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spa-pilot/run_spa_pilot.py spa-pilot/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Add SPA E1 pilot results [skip ci]'
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Upload result artifact
        if: always() && steps.handoff.outputs.owns_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spa-e1-gpt54mini-results
          path: |
            spa-pilot/results/**
            spa-pilot/run_spa_pilot.py
            spa-pilot/README.md
          if-no-files-found: warn
          retention-days: 7

      - name: Destroy any remaining private material
        if: always()
        run: |
          set +e
          shred -u "$RUNNER_TEMP/spa-openai.key" "$RUNNER_TEMP/spa-private.pem" "$RUNNER_TEMP/openai_key.enc" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/openai_key.enc.b64"
